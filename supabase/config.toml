project_id = "holidays"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Le seul mode d'identification du produit (doc 03 §3.1). Aucun compte, aucun
# e-mail, aucun mot de passe : le lien fait office de clé.
enable_anonymous_sign_ins = true
enable_signup = true

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = false

[realtime]
enabled = true

[storage]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false
